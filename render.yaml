services:
  - type: web
    name: desk
    env: node
    plan: free
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start
    envVars:
      DATABASE_URL: file:/data/desk.db
      PRICE_PROVIDER: mock
      TWELVEDATA_API_KEY: ""
      POLYGON_API_KEY: ""
      OANDA_API_KEY: ""
      OANDA_ACCOUNT_ID: ""
      NEWS_PROVIDER: mock
      FINNHUB_API_KEY: ""
      NEWS_API_KEY: ""
    # Mount a persistent disk at /data
    disk:
      name: data
      mountPath: /data
      sizeGB: 1